# Base Wars server configuration. Every value shown is the default; delete a line to use the default.
# The server reads this file at startup from its working directory (or next to the executable).

# world generation
biome_scale = 1.0        # >1 = bigger biomes, <1 = smaller
ocean_level = 0.43       # raise for more water
highlands_height = 0.80  # lower for more mountains
snow_cold = 0.27         # raise for larger snow regions
desert_heat = 0.62       # lower for larger deserts
forest_moisture = 0.58   # lower for larger forests
flower_noise = 0.54      # lower for more flower meadows
island_gate = 0.68       # raise for fewer open-ocean islands

# obstacles (trees, rocks, gold veins), multiplier on density
feature_density_plains = 1.0
feature_density_forest = 1.0
feature_density_highlands = 1.0
feature_density_desert = 1.0
feature_density_flowers = 1.0
feature_density_snow = 1.0
clear_time_scale = 1.0  # multiplier on obstacle clearing time (base: bush 1.5 s, pine 3, oak 4, rock 5, gold vein 7)

# connection
auth_timeout_s = 15           # seconds to wait for Steam to verify a joining player before dropping them

# defeat and resettlement
defeat_ruin_hours = 24           # real hours (wall clock, also while the server is down) a defeated town stays as a burning ruin
resettle_offer_timeout_s = 60    # an offered resettlement site that is not answered within this time is accepted automatically

# NPC towns and factions
town_region_chance = 85       # % of 8x8 chunk regions that hold an NPC town
town_min_distance = 45        # tiles between an NPC town and a player Town Hall
hostile_faction_percent = 25  # % of factions that start hostile towards a new player
faction_war_percent = 30      # % of faction pairs at war: their patrols attack each other's towns

# raids (seconds)
raid_first_delay = 180
raid_first_random = 120
raid_interval = 360
raid_interval_random = 420

# patrols
patrols_per_town_min = 1  # patrol groups each NPC town keeps alive
patrols_per_town_max = 2
patrol_map_groups = 2      # extra map-wide wandering groups per 100 chunks of explored land (0 = none)
patrol_siege_percent = 30  # % of new patrol waypoints that march on a hostile town (faction at war or hostile player)
patrol_siege_range = 140   # tiles a patrol looks for such a town
patrol_respawn_min = 90
patrol_respawn_random = 90

# sheep
sheep_density_plains = 1.0
sheep_density_flowers = 1.0
sheep_max = 900

# progression (clients receive these values on join)
# Building levels run 1..10 and are gated by the Town Hall level (see src/common/Progression.hpp for the unlock / count table).
build_time_scale = 2.0      # multiplier on base construction times (Town Hall 40 s, Outpost 20 s, Mine 18 s ...)
upgrade_cost_growth = 1.9   # upgrade cost from level L = base cost x 0.7 x growth^(L-1) (+ food)
upgrade_time_growth = 1.6   # upgrade time from level L = base build time x build_time_scale x 1.5 x growth^(L-1)
production_scale = 0.6      # multiplier on resource building output
repair_cost_fraction = 0.5  # repair cost = build cost x this x missing HP fraction x level HP factor (+ food)
repair_time_scale = 0.5     # repair time = build time x build_time_scale x this x missing HP fraction

# damaged buildings
damage_min_efficiency = 0.4  # damaged buildings produce / train / store / shoot at max(HP fraction, this)
damage_critical_hp = 0.25    # below this HP fraction a building is disabled until repaired

# food (meat) costs
# Buildings, upgrades and repairs cost food = 20% of their wood + gold + stone cost x the multiplier below;
# units cost their listed meat x food_cost_train. Hunting sheep (free pawns) and harbours bring food in.
food_cost_build = 1.0
food_cost_upgrade = 1.0
food_cost_repair = 1.0
food_cost_train = 1.0

# donations and NPC town demand
donation_cooldown = 60   # seconds between two donations (to a faction) or clan transfers of one player
demand_change_min = 600  # seconds until a faction wants a different resource (random between min and max)
demand_change_max = 1200
demand_bonus = 2.0       # reputation multiplier for gifts of the wanted resource
demand_satisfy = 400     # gifts of the wanted resource that satisfy the faction: the demand then moves on
donation_diminish = 150  # recent gifts of the same resource count less: reputation x 1 / (1 + recent / this)
donation_memory = 900    # seconds for the memory of recent gifts to fade

# debug timers (1 = complete instantly, for testing)
# instant build / upgrade (upgrade also covers repairs) complete immediately without waiting for a pawn.
debug_instant_build = 0
debug_instant_upgrade = 0
debug_instant_train = 0
debug_instant_clear = 0
